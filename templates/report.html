<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  VAIS report skeleton (v2.0)
  - {{TOKEN}} 슬롯을 brand DESIGN.md 값으로 치환해 사용한다.
  - 외부 리소스 참조 금지 (자체 포함). 차트는 인라인 SVG.
  - 규칙 정본: skills/report/design-rules.md
-->
<style>
  :root {
    /* ── brand tokens ── (design-system/brands/{{BRAND}}/DESIGN.md) */
    --color-primary: {{COLOR_PRIMARY}};
    --color-ink: {{COLOR_INK}};          /* 헤드라인 */
    --color-body: {{COLOR_BODY}};        /* 본문 */
    --color-muted: {{COLOR_MUTED}};      /* 보조 텍스트·축 라벨 */
    --color-hairline: {{COLOR_HAIRLINE}};/* 구분선·표 행 */
    --color-canvas: {{COLOR_CANVAS}};    /* 페이지 배경 */
    --color-surface: {{COLOR_SURFACE}};  /* 카드·callout 배경 */
    --font-display: {{FONT_DISPLAY}}, "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    --font-body: {{FONT_BODY}}, "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    /* ── 고정 스케일 (design-rules) ── */
    --fs-xs: 12px; --fs-sm: 14px; --fs-base: 17px; --fs-lg: 22px; --fs-xl: 28px; --fs-xxl: 40px;
    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-5: 48px; --sp-6: 64px; --sp-7: 96px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.65;
    color: var(--color-body); background: var(--color-canvas);
    word-break: keep-all;
  }
  main { max-width: 760px; margin: 0 auto; padding: var(--sp-6) var(--sp-3) var(--sp-7); }
  h1, h2, h3 { font-family: var(--font-display); color: var(--color-ink); line-height: 1.3; }
  h1 { font-size: var(--fs-xxl); font-weight: 700; }
  h2 { font-size: var(--fs-xl); font-weight: 700; margin: var(--sp-6) 0 var(--sp-3); }
  h3 { font-size: var(--fs-lg); font-weight: 600; margin: var(--sp-4) 0 var(--sp-2); }
  p { margin: 0 0 var(--sp-2); }
  a { color: var(--color-primary); }

  /* 커버 */
  .cover { padding: var(--sp-7) 0 var(--sp-5); border-bottom: 3px solid var(--color-primary); margin-bottom: var(--sp-5); }
  .cover .kicker { font-size: var(--fs-sm); font-weight: 600; color: var(--color-primary); letter-spacing: .06em; text-transform: uppercase; margin-bottom: var(--sp-2); }
  .cover .meta { margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--color-muted); }

  /* 넓은 요소 (표·차트 돌출 허용 920px) */
  .wide { width: min(920px, calc(100vw - 2 * var(--sp-3))); margin-left: 50%; transform: translateX(-50%); }

  /* KPI 행 — 큰 숫자 레이아웃 */
  .kpis { display: flex; gap: var(--sp-2); margin: var(--sp-4) 0; flex-wrap: wrap; }
  .kpi { flex: 1 1 140px; padding: var(--sp-3); background: var(--color-surface); border-radius: 8px; }
  .kpi b { display: block; font-family: var(--font-display); font-size: var(--fs-xl); color: var(--color-ink); font-feature-settings: "tnum"; }
  .kpi span { font-size: var(--fs-sm); color: var(--color-muted); }

  /* 표 — hairline 행 구분만 */
  table { width: 100%; border-collapse: collapse; margin: var(--sp-3) 0; font-size: var(--fs-sm); }
  th { text-align: left; font-weight: 600; color: var(--color-ink); border-bottom: 2px solid var(--color-ink); padding: var(--sp-1) var(--sp-2); }
  td { border-bottom: 1px solid var(--color-hairline); padding: var(--sp-1) var(--sp-2); vertical-align: top; }
  td.num, th.num { text-align: right; font-feature-settings: "tnum"; }

  /* 차트 figure */
  figure { margin: var(--sp-4) 0; }
  figcaption { font-size: var(--fs-xs); color: var(--color-muted); margin-top: var(--sp-1); }
  figure svg { display: block; max-width: 100%; height: auto; }

  /* Callout */
  .callout { border-left: 3px solid var(--color-primary); background: var(--color-surface); padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; border-radius: 0 8px 8px 0; }

  /* 타임라인 */
  .timeline { list-style: none; margin: var(--sp-3) 0; }
  .timeline li { position: relative; padding: 0 0 var(--sp-3) var(--sp-4); border-left: 2px solid var(--color-hairline); margin-left: var(--sp-1); }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); }
  .timeline li:last-child { border-left-color: transparent; }
  .timeline b { color: var(--color-ink); }

  footer { margin-top: var(--sp-7); padding-top: var(--sp-3); border-top: 1px solid var(--color-hairline); font-size: var(--fs-xs); color: var(--color-muted); }

  @media print {
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    .wide { width: 100%; margin-left: 0; transform: none; }
    table, figure, .kpi, .callout { break-inside: avoid; }
    h2 { break-after: avoid; }
    @page { margin: 18mm; }
  }
</style>
</head>
<body>
<main>
  <header class="cover">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{DATE}} · {{AUTHOR}}</p>
  </header>

  <!-- 섹션 패턴 예시 — 연속 2섹션 같은 레이아웃 금지 (design-rules #3)

  [큰 숫자] <div class="kpis"><div class="kpi"><b>-73%</b><span>세션 오버헤드</span></div>...</div>

  [표]      <table class="wide">...</table>

  [callout] <div class="callout"><b>핵심:</b> 한 문장 결론.</div>

  [타임라인] <ul class="timeline"><li><b>Phase 0</b> — 요지</li>...</ul>

  [SVG 막대차트 — 강조 1 + 회색 패턴]
  <figure>
    <svg viewBox="0 0 600 200" role="img" aria-label="...">
      <line x1="40" y1="170" x2="580" y2="170" stroke="var(--color-hairline)"/>
      <rect x="60"  y="40"  width="48" height="130" fill="var(--color-primary)"/>
      <rect x="140" y="90"  width="48" height="80"  fill="var(--color-muted)" opacity=".4"/>
      <text x="84" y="30" text-anchor="middle" font-size="13" fill="var(--color-ink)">1.5MB</text>
    </svg>
    <figcaption>그림 1 — 캡션.</figcaption>
  </figure>
  -->

  {{CONTENT}}

  <footer>{{FOOTER}}</footer>
</main>
</body>
</html>

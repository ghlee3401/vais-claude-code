<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  VAIS deck skeleton (v2.0) — 16:9 HTML 슬라이드. ←/→/Space 내비, 인쇄 = 슬라이드당 1페이지.
  {{TOKEN}} 슬롯을 brand DESIGN.md 값으로 치환. 규칙 정본: skills/report/design-rules.md
-->
<style>
  :root {
    --color-primary: {{COLOR_PRIMARY}};
    --color-ink: {{COLOR_INK}};
    --color-body: {{COLOR_BODY}};
    --color-muted: {{COLOR_MUTED}};
    --color-hairline: {{COLOR_HAIRLINE}};
    --color-canvas: {{COLOR_CANVAS}};
    --color-surface: {{COLOR_SURFACE}};
    --font-display: {{FONT_DISPLAY}}, "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    --font-body: {{FONT_BODY}}, "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    --fs-sm: 16px; --fs-base: 20px; --fs-lg: 26px; --fs-xl: 34px; --fs-xxl: 52px;
    --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-6: 64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: var(--font-body); color: var(--color-body); background: #111; word-break: keep-all; }

  .slide {
    width: 1280px; height: 720px; margin: 24px auto; padding: var(--sp-6);
    background: var(--color-canvas); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    font-size: var(--fs-base); line-height: 1.6;
  }
  /* 제목 위치 고정 (슬라이드마다 튀지 않게) */
  .slide > h2 { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 700; color: var(--color-ink); margin-bottom: var(--sp-4); }
  .slide .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-3); }
  .slide .page { position: absolute; right: var(--sp-4); bottom: var(--sp-3); font-size: 13px; color: var(--color-muted); font-feature-settings: "tnum"; }

  /* 타이틀 슬라이드 */
  .slide.title { justify-content: center; border-top: 6px solid var(--color-primary); }
  .slide.title .kicker { font-size: var(--fs-sm); font-weight: 600; color: var(--color-primary); letter-spacing: .06em; text-transform: uppercase; margin-bottom: var(--sp-2); }
  .slide.title h1 { font-family: var(--font-display); font-size: var(--fs-xxl); color: var(--color-ink); line-height: 1.2; max-width: 900px; }
  .slide.title .meta { margin-top: var(--sp-4); color: var(--color-muted); font-size: var(--fs-sm); }

  /* 콘텐츠 패턴 */
  .kpis { display: flex; gap: var(--sp-3); }
  .kpi { flex: 1; padding: var(--sp-4); background: var(--color-surface); border-radius: 10px; }
  .kpi b { display: block; font-family: var(--font-display); font-size: var(--fs-xxl); color: var(--color-ink); font-feature-settings: "tnum"; line-height: 1.1; }
  .kpi span { font-size: var(--fs-sm); color: var(--color-muted); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); align-items: start; }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  th { text-align: left; font-weight: 600; color: var(--color-ink); border-bottom: 2px solid var(--color-ink); padding: 8px 12px; }
  td { border-bottom: 1px solid var(--color-hairline); padding: 8px 12px; }
  td.num, th.num { text-align: right; font-feature-settings: "tnum"; }
  .statement { font-family: var(--font-display); font-size: var(--fs-xl); color: var(--color-ink); line-height: 1.4; max-width: 980px; }
  .statement em { color: var(--color-primary); font-style: normal; }
  ul.plain { list-style: none; } ul.plain li { padding-left: 20px; position: relative; margin-bottom: var(--sp-2); }
  ul.plain li::before { content: ""; position: absolute; left: 0; top: .55em; width: 8px; height: 8px; border-radius: 2px; background: var(--color-primary); }

  @media print {
    body { background: #fff; }
    .slide { margin: 0; border-radius: 0; page-break-after: always; }
    @page { size: 1280px 720px; margin: 0; }
  }
  @media screen { body.present .slide { display: none; } body.present .slide.active { display: flex; } }
</style>
</head>
<body>

<section class="slide title">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <p class="meta">{{DATE}} · {{AUTHOR}}</p>
</section>

<!-- 슬라이드 패턴 (1장 1메시지 + 근거 1 — design-rules #6, 연속 동일 레이아웃 금지 #3)

[주장]   <section class="slide"><h2>제목</h2><div class="body"><p class="statement">핵심 문장 <em>강조</em>.</p></div><div class="page">2</div></section>
[KPI]    <div class="kpis"><div class="kpi"><b>-73%</b><span>설명</span></div>...</div>
[비교]   <div class="split"><div>...</div><div>...</div></div>
[표/차트] report.html 과 동일 패턴 (인라인 SVG)
-->

{{SLIDES}}

<script>
  // 키보드 내비: ←/→/Space. p = 프레젠테이션 모드 토글(1장씩), 기본은 스크롤 뷰.
  (function () {
    const slides = Array.from(document.querySelectorAll('.slide'));
    let i = 0;
    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, k) => s.classList.toggle('active', k === i));
      if (!document.body.classList.contains('present')) slides[i].scrollIntoView({ behavior: 'smooth' });
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(i + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
      if (e.key === 'p') { document.body.classList.toggle('present'); show(i); }
    });
    show(0);
  })();
</script>
</body>
</html>

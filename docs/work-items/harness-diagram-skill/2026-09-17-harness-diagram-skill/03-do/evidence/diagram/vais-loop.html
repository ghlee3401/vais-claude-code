<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAIS 사용자 루프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · VAIS</p>
    <h1>VAIS 사용자 루프 — 말하기에서 기록까지</h1>

    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vais-loop-title vais-loop-desc">
      <title id="vais-loop-title">VAIS 사용자 루프</title>
      <desc id="vais-loop-desc">사용자가 말하면 요청 확인과 고르기를 거쳐 자동으로 만들고, 화면을 확인한 뒤 자동으로 기록되는 한 바퀴 흐름</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <line x1="184" y1="120" x2="216" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="344" y1="120" x2="376" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="504" y1="120" x2="536" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="664" y1="120" x2="696" y2="120" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="824" y1="120" x2="856" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- revise loop: 확인 → 만들기 (top elbow, r=8) -->
      <path d="M 760,96 V 72 Q 760,64 752,64 H 608 Q 600,64 600,72 V 88" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="640" y="56" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="680" y="68" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">수정 · 최대 5회</text>
      <!-- record loop back to 말하기 (bottom elbow) -->
      <path d="M 920,144 V 200 Q 920,208 912,208 H 128 Q 120,208 120,200 V 152" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="464" y="200" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="520" y="212" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">다음 작업에 장부 주입</text>

      <!-- nodes: input · gates · auto -->
      <rect x="56" y="96" width="128" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="56" y="96" width="128" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">말하기</text>
      <text x="120" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/vais ...</text>

      <rect x="216" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="96" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">요청 확인</text>
      <text x="280" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan approve</text>

      <rect x="376" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="96" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">고르기</text>
      <text x="440" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">design approve</text>

      <rect x="536" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="96" width="128" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="600" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">만들기</text>
      <text x="600" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto · do ready</text>

      <rect x="696" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="96" width="128" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="760" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">확인</text>
      <text x="760" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">screens · QA · approve</text>

      <rect x="856" y="96" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="96" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="920" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">기록</text>
      <text x="920" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto · ledger</text>

      <!-- legend strip -->
      <line x1="30" y1="292" x2="970" y2="292" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="300" width="24" height="12" rx="3" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="152" y="310" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">사용자 입력</text>
      <rect x="280" y="300" width="24" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="312" y="310" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">사용자 결정 Gate</text>
      <rect x="464" y="300" width="24" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="496" y="310" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">runtime 자동</text>
      <rect x="624" y="300" width="24" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="656" y="310" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">화면·QA 확인 정지점</text>
      <line x1="824" y1="306" x2="856" y2="306" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="864" y="310" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">기억</text>
    </svg>
  </div>
</body>
</html>
